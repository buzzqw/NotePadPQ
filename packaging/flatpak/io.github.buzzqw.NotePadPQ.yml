app-id: io.github.buzzqw.NotePadPQ
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.python3//24.08

command: notepadpq

finish-args:
  # Wayland + X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU access (Qt rendering)
  - --device=dri
  # Full filesystem access — needed to open arbitrary files
  - --filesystem=host
  # Network access — for AI plugin, LSP servers, FTP plugin
  - --share=network
  # D-Bus — for single-instance guard, keyring
  - --socket=session-bus
  - --talk-name=org.freedesktop.secrets

build-options:
  append-path: /usr/lib/sdk/python3/bin
  env:
    PIP_PREFIX: /app
    PIP_DISABLE_PIP_VERSION_CHECK: '1'

modules:
  # ── Python pip dependencies ───────────────────────────────────────────────
  # Generate with: flatpak-pip-generator --runtime org.kde.Platform//6.7 \
  #   PyQt6-QScintilla chardet markdown docutils pyspellchecker \
  #   keyring cryptography PyGithub python-gitlab pygments psutil \
  #   mammoth htmldocx openpyxl xlrd odfpy pymupdf matplotlib sympy
  # Then include the generated python3-modules.json here.
  #
  # Until then, install via pip at build time (not suitable for Flathub
  # which requires offline builds — use flatpak-pip-generator output):
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation
          PyQt6-QScintilla
          chardet
          markdown
          docutils
          pyspellchecker
          keyring
          cryptography
          PyGithub
          python-gitlab
          pygments
          psutil
          mammoth
          htmldocx
          openpyxl
          xlrd
          odfpy
    sources:
      - type: shell
        commands:
          - echo "pip deps installed at build time — replace with pip-generator output for Flathub"

  # ── Application ───────────────────────────────────────────────────────────
  - name: notepadpq
    buildsystem: simple
    build-commands:
      # Install application files
      - install -d /app/lib/notepadpq
      - cp -r . /app/lib/notepadpq/
      - rm -rf /app/lib/notepadpq/packaging /app/lib/notepadpq/.git

      # Executable wrapper
      - install -d /app/bin
      - |
        cat > /app/bin/notepadpq << 'EOF'
        #!/bin/bash
        exec python3 /app/lib/notepadpq/main.py "$@"
        EOF
      - chmod 755 /app/bin/notepadpq

      # Desktop entry (with Flatpak app-id)
      - install -Dm644 data/notepadpq.desktop
          /app/share/applications/io.github.buzzqw.NotePadPQ.desktop
      - desktop-file-edit --set-key=Icon
          --set-value=io.github.buzzqw.NotePadPQ
          /app/share/applications/io.github.buzzqw.NotePadPQ.desktop

      # AppStream metadata
      - install -Dm644 data/io.github.buzzqw.NotePadPQ.metainfo.xml
          /app/share/metainfo/io.github.buzzqw.NotePadPQ.metainfo.xml

      # Icons
      - install -Dm644 icons/NotePadPQ_16.png
          /app/share/icons/hicolor/16x16/apps/io.github.buzzqw.NotePadPQ.png
      - install -Dm644 icons/NotePadPQ_32.png
          /app/share/icons/hicolor/32x32/apps/io.github.buzzqw.NotePadPQ.png
      - install -Dm644 icons/NotePadPQ_48.png
          /app/share/icons/hicolor/48x48/apps/io.github.buzzqw.NotePadPQ.png
      - install -Dm644 icons/NotePadPQ_64.png
          /app/share/icons/hicolor/64x64/apps/io.github.buzzqw.NotePadPQ.png
      - install -Dm644 icons/NotePadPQ_128.png
          /app/share/icons/hicolor/128x128/apps/io.github.buzzqw.NotePadPQ.png
      - install -Dm644 icons/NotePadPQ_256.png
          /app/share/icons/hicolor/256x256/apps/io.github.buzzqw.NotePadPQ.png

    sources:
      - type: git
        url: https://github.com/buzzqw/NotePadPQ.git
        tag: '1.1.7'
        # commit: fill in after tagging the release
