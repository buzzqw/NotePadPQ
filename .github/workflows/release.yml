name: Build AppImage

# Trigger: si attiva quando versiona.sh pubblica la release su GitHub
# (release:published), oppure manualmente dalla UI Actions.
#
# Usiamo release:published invece di push:tags perché versiona.sh crea
# la release DOPO il push del tag — la release è già pronta quando
# questo job parte, quindi gh release upload non incontra race condition.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release (es. v1.4.2)'
        required: true
        type: string

permissions:
  contents: write   # necessario per caricare asset nella release

jobs:
  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04   # glibc 2.35 — compatibile con distro 2022+

    steps:
      # ── Determina il tag (release event oppure input manuale) ─────────────
      - name: Determina tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Checkout al tag specificato ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      # ── Calcola variabili di versione ─────────────────────────────────────
      - name: Versione
        id: ver
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          VER="${TAG#v}"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # ── Dipendenze di sistema ─────────────────────────────────────────────
      # Librerie XCB/OpenGL necessarie a Qt6 anche in ambienti headless
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb1 libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 libx11-xcb1 \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 \
            patchelf desktop-file-utils \
            xvfb   # display virtuale per init Qt in CI

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── Dipendenze Python ─────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip wheel
          # Dipendenze obbligatorie
          pip install \
            "PyQt6>=6.6" \
            "PyQt6-QScintilla>=2.13" \
            "PyQt6-WebEngine>=6.6" \
            chardet markdown docutils \
            pyspellchecker keyring cryptography \
            pygments psutil
          # Plugin opzionali (inclusi nel bundle per completezza)
          pip install \
            mammoth htmldocx \
            openpyxl xlrd odfpy \
            PyGithub python-gitlab \
            paramiko pymupdf sympy matplotlib || true
          # PyInstaller
          pip install "pyinstaller>=6.3" pyinstaller-hooks-contrib

      # ── Build PyInstaller ─────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: |
          xvfb-run --auto-servernum \
            pyinstaller packaging/appimage/notepadpq.spec --noconfirm
        # xvfb-run evita crash di Qt durante l'analisi degli import in CI

      # ── Assembla AppDir ───────────────────────────────────────────────────
      - name: Create AppDir
        run: bash packaging/appimage/make-appdir.sh

      # ── appimagetool ──────────────────────────────────────────────────────
      - name: Download appimagetool
        run: |
          wget -q \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          # Estrai senza FUSE (non disponibile in GitHub Actions)
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-extracted

      - name: Build AppImage
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          APPIMAGE_NAME="NotePadPQ-${VERSION}-x86_64.AppImage"
          ARCH=x86_64 appimagetool-extracted/AppRun \
            --comp zstd \
            dist/notepadpq.AppDir \
            "${APPIMAGE_NAME}"
          echo "appimage=${APPIMAGE_NAME}" >> "$GITHUB_ENV"

      # ── Verifica ─────────────────────────────────────────────────────────
      - name: Verify AppImage
        run: |
          ls -lh "${APPIMAGE_NAME}"
          file "${APPIMAGE_NAME}"

      # ── Upload alla release GitHub ────────────────────────────────────────
      - name: Upload AppImage to release
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            "${APPIMAGE_NAME}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
